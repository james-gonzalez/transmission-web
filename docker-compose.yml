# Copy .env.example to .env and fill it in, then: docker compose up -d
services:
  transmission-web:
    image: ghcr.io/james-gonzalez/transmission-web:latest
    container_name: transmission-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TRANSMISSION_URL: "${TRANSMISSION_URL:?set TRANSMISSION_URL in .env}"
      TRANSMISSION_USER: "${TRANSMISSION_USER:-transmission}"
      TRANSMISSION_PASS: "${TRANSMISSION_PASS:-}"
